<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>낚시 왕국</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Malgun Gothic",sans-serif;
  background:#071d2d;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   시작 화면
========================= */

#serverSelect{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 20%,#39bfff 0%,transparent 35%),
    linear-gradient(#063b62,#031521);
}

.serverBox{
  width:min(92%,650px);
  padding:35px 25px;
  border-radius:25px;
  background:rgba(0,0,0,.48);
  border:2px solid rgba(255,255,255,.2);
  box-shadow:0 20px 60px #0009;
  text-align:center;
  color:white;
}

.serverBox h1{
  margin:0 0 10px;
  font-size:42px;
}

.serverBox p{
  color:#ccefff;
  margin-bottom:30px;
}

.serverButtons{
  display:flex;
  gap:15px;
  justify-content:center;
}

.serverButtons button{
  flex:1;
  min-height:100px;
  border:0;
  border-radius:20px;
  font-size:22px;
  font-weight:bold;
  color:white;
  box-shadow:0 8px 20px #0006;
}

.privateBtn{
  background:linear-gradient(135deg,#1687ff,#0752b8);
}

.publicBtn{
  background:linear-gradient(135deg,#a83cff,#5620b9);
}

.serverButtons button:active{
  transform:scale(.96);
}

/* =========================
   공용 닉네임
========================= */

#nicknameScreen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,10,20,.92);
}

.nicknameBox{
  width:min(90%,430px);
  padding:30px;
  background:#102c40;
  border:2px solid #4cc9ff;
  border-radius:20px;
  text-align:center;
  color:white;
}

.nicknameBox h2{
  margin-top:0;
}

.nicknameBox input{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:18px;
  margin:15px 0;
  outline:none;
}

.nicknameBox button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#24a8ff;
  color:white;
  font-weight:bold;
  font-size:18px;
}

/* =========================
   공용 서버
========================= */

#publicGame{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(#5fd5ff 0%,#b8efff 42%,#1482ae 43%,#075b80 100%);
}

.publicTop{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  gap:10px;
  pointer-events:none;
}

.publicInfo,
.publicCodexInfo{
  pointer-events:auto;
  background:#061c2ccc;
  color:white;
  padding:10px 15px;
  border-radius:14px;
  border:1px solid #ffffff33;
}

.publicCodexInfo{
  cursor:pointer;
}

.publicWorld{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:72%;
  overflow:hidden;
}

.publicFloor{
  position:absolute;
  left:-100%;
  width:300%;
  bottom:0;
  height:130px;
  background:
    repeating-linear-gradient(
      90deg,
      #a76b35 0 70px,
      #8d562b 70px 74px
    );
  border-top:8px solid #603a21;
}

.publicSea{
  position:absolute;
  left:0;
  right:0;
  bottom:130px;
  height:50%;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.08) 0 5px,
      transparent 5px 30px
    ),
    linear-gradient(#24b9dc,#08789e);
}

.publicCollectible{
  position:absolute;
  width:62px;
  height:62px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:#ffffffbb;
  border:3px solid #fff;
  box-shadow:0 0 20px #fff;
  cursor:pointer;
  user-select:none;
  animation:floatFish 2s ease-in-out infinite;
  z-index:5;
}

.publicCollectible.caught{
  opacity:.35;
  filter:grayscale(1);
}

@keyframes floatFish{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

.publicPlayer{
  position:absolute;
  bottom:130px;
  width:55px;
  height:85px;
  z-index:10;
  transition:left .06s linear;
}

.playerHead{
  width:34px;
  height:34px;
  margin:auto;
  border-radius:50%;
  background:#ffd0a6;
  border:2px solid #573820;
}

.playerBody{
  width:45px;
  height:48px;
  margin:3px auto 0;
  border-radius:12px 12px 6px 6px;
  border:2px solid #222;
}

.playerName{
  position:absolute;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:#061c2cdd;
  color:white;
  padding:3px 7px;
  border-radius:7px;
  font-size:12px;
}

.publicHint{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  background:#061c2cdd;
  color:white;
  padding:10px 18px;
  border-radius:20px;
  white-space:nowrap;
}

/* =========================
   공용 도감
========================= */

#publicCodexModal{
  position:fixed;
  inset:0;
  z-index:100;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.codexPanel{
  width:min(1000px,100%);
  height:min(85vh,750px);
  background:#102c40;
  border:2px solid #48c9ff;
  border-radius:20px;
  color:white;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.codexHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.codexHeader button{
  border:0;
  background:#e84a4a;
  color:white;
  border-radius:10px;
  padding:9px 14px;
}

.codexTabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:12px 0;
}

.codexTabs button{
  border:0;
  background:#214d65;
  color:white;
  border-radius:9px;
  padding:9px 13px;
  white-space:nowrap;
}

.codexTabs button.active{
  background:#1ca9ee;
}

.codexGrid{
  flex:1;
  overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;
  padding:5px;
}

.codexCard{
  min-height:125px;
  border-radius:12px;
  background:#173c51;
  padding:8px;
  text-align:center;
  border:1px solid #ffffff16;
}

.codexCard.known{
  background:#214f65;
}

.codexFish{
  font-size:34px;
}

.codexUnknown{
  font-size:34px;
  color:#aaa;
}

.codexCard small{
  display:block;
  margin-top:4px;
  color:#bceaff;
}

/* =========================
   개인 게임
========================= */

#privateGame{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(#48bfe8 0 32%,#1589aa 32% 100%);
}

.privateSky{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:32%;
  background:
    radial-gradient(circle at 20% 30%,#fff 0 25px,transparent 26px),
    radial-gradient(circle at 70% 20%,#fff 0 20px,transparent 21px),
    linear-gradient(#54cef5,#b9f0ff);
  opacity:.9;
}

.ocean{
  position:absolute;
  left:0;
  right:0;
  top:32%;
  bottom:0;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.06) 0 5px,
      transparent 5px 32px
    ),
    linear-gradient(#16a6cb,#056081);
}

.dock{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:38%;
  background:
    repeating-linear-gradient(
      90deg,
      #a76a35 0 80px,
      #74441f 80px 86px
    );
  border-top:10px solid #55341c;
  z-index:5;
}

.character{
  position:absolute;
  left:38%;
  bottom:25%;
  z-index:10;
  width:100px;
  height:160px;
}

.characterHead{
  width:55px;
  height:55px;
  margin:auto;
  border-radius:50%;
  background:#ffd0a6;
  border:3px solid #513b2c;
}

.characterBody{
  width:75px;
  height:90px;
  margin:5px auto;
  background:#2979ff;
  border:3px solid #17408e;
  border-radius:20px 20px 10px 10px;
}

.rod{
  position:absolute;
  width:180px;
  height:7px;
  background:#49301e;
  transform:rotate(-30deg);
  right:-130px;
  top:55px;
  transform-origin:left center;
}

.bobber{
  position:absolute;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#ff4848;
  border:3px solid white;
  z-index:20;
}

#privateUI{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
}

.topLeft{
  position:absolute;
  left:10px;
  top:10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.moneyBox,
.rodBox{
  background:#061c2cdd;
  color:white;
  padding:9px 13px;
  border-radius:12px;
}

.topButtons{
  position:absolute;
  right:10px;
  top:10px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
  pointer-events:auto;
}

.uiBtn{
  border:0;
  border-radius:10px;
  padding:9px 12px;
  background:#102d3fdd;
  color:white;
  font-weight:bold;
}

.uiBtn:hover{
  background:#1b536d;
}

.actionButtons{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.castBtn{
  padding:15px 28px;
  border:0;
  border-radius:15px;
  background:#087ee8;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.catchBar{
  position:absolute;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  width:min(600px,90%);
  height:35px;
  background:#162533;
  border:3px solid white;
  border-radius:20px;
  overflow:hidden;
  pointer-events:none;
}

.catchFill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#19d77c,#fff200);
}

.catchText{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-weight:bold;
}

.catchResult{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:50;
  min-width:250px;
  padding:20px;
  border-radius:20px;
  background:#061c2cee;
  color:white;
  text-align:center;
  font-size:22px;
  box-shadow:0 15px 50px #0009;
  pointer-events:none;
}

.traitNormal{
  border-color:#aaa!important;
}

.traitDifferent{
  border-color:#4ab9ff!important;
  box-shadow:0 0 20px #4ab9ff;
}

.traitShiny{
  border-color:#fff500!important;
  box-shadow:0 0 25px #fff500;
  animation:shine 1s infinite alternate;
}

.traitRainbow{
  border:3px solid transparent!important;
  background:
    linear-gradient(#173c51,#173c51) padding-box,
    linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet) border-box!important;
  animation:rainbowGlow 1s linear infinite;
}

@keyframes shine{
  from{filter:brightness(1)}
  to{filter:brightness(1.6)}
}

@keyframes rainbowGlow{
  0%{filter:hue-rotate(0deg)}
  100%{filter:hue-rotate(360deg)}
}

/* =========================
   모달
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  background:#000b;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.modalBox{
  width:min(900px,100%);
  max-height:90vh;
  overflow:auto;
  background:#102c40;
  color:white;
  border-radius:20px;
  padding:20px;
  border:2px solid #3eb9ed;
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.closeBtn{
  border:0;
  background:#df4646;
  color:white;
  padding:8px 12px;
  border-radius:8px;
}

.shopGrid,
.inventoryGrid,
.saveGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:10px;
  margin-top:15px;
}

.itemCard{
  background:#183e52;
  border-radius:12px;
  padding:12px;
  border:1px solid #ffffff18;
}

.itemCard button{
  width:100%;
  margin-top:8px;
  border:0;
  border-radius:8px;
  padding:9px;
  background:#148de0;
  color:white;
  font-weight:bold;
}

.sellBtn{
  background:#16a86b!important;
}

.deleteBtn{
  background:#df4444!important;
}

.saveInput{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  font-size:17px;
  margin:10px 0;
}

@media(max-width:700px){
  .serverBox h1{
    font-size:32px;
  }

  .serverButtons{
    flex-direction:column;
  }

  .serverButtons button{
    min-height:75px;
  }

  .topButtons{
    top:75px;
  }

  .topLeft{
    top:10px;
  }

  .character{
    left:30%;
  }

  .publicHint{
    font-size:13px;
  }

  .codexGrid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<!-- =========================
     서버 선택
========================= -->

<div id="serverSelect">
  <div class="serverBox">
    <h1>🎣 낚시 왕국</h1>
    <p>어디에서 플레이할까요?</p>

    <div class="serverButtons">
      <button class="privateBtn" onclick="startPrivate()">
        🎣<br>개인 서버
        <small>낚시 · 상점 · 저장</small>
      </button>

      <button class="publicBtn" onclick="openNickname()">
        🌐<br>공용 서버
        <small>다른 플레이어와 함께</small>
      </button>
    </div>
  </div>
</div>

<!-- =========================
     닉네임
========================= -->

<div id="nicknameScreen" class="hidden">
  <div class="nicknameBox">
    <h2>🌐 공용 서버 입장</h2>
    <p>다른 플레이어에게 표시될 이름을 입력하세요.</p>

    <input id="nicknameInput"
           maxlength="12"
           placeholder="닉네임">

    <button onclick="joinPublicServer()">
      공용 서버 입장
    </button>

    <button
      style="margin-top:8px;background:#555"
      onclick="closeNickname()">
      취소
    </button>
  </div>
</div>

<!-- =========================
     공용 게임
========================= -->

<div id="publicGame" class="hidden">

  <div class="publicTop">
    <div class="publicInfo">
      🌐 공용 서버<br>
      <span id="publicName">-</span>
    </div>

    <div class="publicCodexInfo"
         onclick="openPublicCodex()">
      📖 공용 도감
      <span id="publicCodexCount">0</span>/400
    </div>
  </div>

  <div class="publicWorld" id="publicWorld">

    <div class="publicSea"></div>
    <div class="publicFloor"></div>

  </div>

  <div class="publicHint">
    ⬅️ A / D ➡️ 이동 · 🐟 물고기를 찾아 클릭하세요
  </div>
</div>

<!-- =========================
     공용 도감
========================= -->

<div id="publicCodexModal" class="hidden">
  <div class="codexPanel">

    <div class="codexHeader">
      <h2>📖 공용 물고기 도감</h2>
      <button onclick="closePublicCodex()">닫기</button>
    </div>

    <div class="codexTabs">
      <button class="active" onclick="setPublicCodexTab('all',this)">전체</button>
      <button onclick="setPublicCodexTab('normal',this)">🐟 기본</button>
      <button onclick="setPublicCodexTab('different',this)">🎨 색이 다른</button>
      <button onclick="setPublicCodexTab('shiny',this)">✨ 빛나는</button>
      <button onclick="setPublicCodexTab('rainbow',this)">🌈 무지개</button>
    </div>

    <div id="publicCodexGrid" class="codexGrid"></div>

  </div>
</div>

<!-- =========================
     개인 게임
========================= -->

<div id="privateGame" class="hidden">

  <div class="privateSky"></div>
  <div class="ocean"></div>
  <div class="dock"></div>

  <div class="character">
    <div class="characterHead"></div>
    <div class="characterBody"></div>
    <div class="rod"></div>
  </div>

  <div id="bobber" class="bobber hidden"></div>

  <div id="privateUI">

    <div class="topLeft">
      <div class="moneyBox">
        💰 <span id="moneyText">0</span> G
      </div>

      <div class="rodBox">
        🎣 <span id="rodText">나뭇가지 낚싯대</span>
      </div>
    </div>

    <div class="topButtons">
      <button class="uiBtn" onclick="openInventory()">🎒 인벤토리</button>
      <button class="uiBtn" onclick="openCodex()">📖 도감</button>
      <button class="uiBtn" onclick="openShop()">🛒 상점</button>
      <button class="uiBtn" onclick="openSell()">💰 판매</button>
      <button class="uiBtn" onclick="openSave()">💾 저장</button>
      <button class="uiBtn" onclick="openLoad()">📂 불러오기</button>
      <button class="uiBtn" onclick="backToServers()">🏠 나가기</button>
    </div>

    <div class="actionButtons">
      <button class="castBtn" onclick="startFishing()">
        🎣 낚시
      </button>
    </div>

    <div id="catchBar" class="catchBar hidden">
      <div id="catchFill" class="catchFill"></div>
      <div class="catchText">클릭 또는 ENTER를 빠르게 누르세요!</div>
    </div>

    <div id="catchResult" class="catchResult hidden"></div>

  </div>
</div>

<!-- =========================
     인벤토리
========================= -->

<div id="inventoryModal" class="modal hidden">
  <div class="modalBox">

    <div class="modalHeader">
      <h2>🎒 물고기 인벤토리</h2>
      <button class="closeBtn" onclick="closeModal('inventoryModal')">닫기</button>
    </div>

    <div id="inventoryGrid" class="inventoryGrid"></div>

  </div>
</div>

<!-- =========================
     상점
========================= -->

<div id="shopModal" class="modal hidden">
  <div class="modalBox">

    <div class="modalHeader">
      <h2>🛒 낚싯대 상점</h2>
      <button class="closeBtn" onclick="closeModal('shopModal')">닫기</button>
    </div>

    <div id="shopGrid" class="shopGrid"></div>

  </div>
</div>

<!-- =========================
     판매
========================= -->

<div id="sellModal" class="modal hidden">
  <div class="modalBox">

    <div class="modalHeader">
      <h2>💰 물고기 판매</h2>
      <button class="closeBtn" onclick="closeModal('sellModal')">닫기</button>
    </div>

    <p>원하는 물고기만 선택해서 판매할 수 있습니다.</p>

    <div id="sellGrid" class="inventoryGrid"></div>

  </div>
</div>

<!-- =========================
     도감
========================= -->

<div id="codexModal" class="modal hidden">
  <div class="codexPanel">

    <div class="codexHeader">
      <h2>📖 물고기 도감</h2>
      <button class="closeBtn" onclick="closeModal('codexModal')">닫기</button>
    </div>

    <div class="codexTabs">
      <button class="active" onclick="setPrivateCodexTab('all',this)">전체</button>
      <button onclick="setPrivateCodexTab('normal',this)">🐟 기본</button>
      <button onclick="setPrivateCodexTab('different',this)">🎨 색이 다른</button>
      <button onclick="setPrivateCodexTab('shiny',this)">✨ 빛나는</button>
      <button onclick="setPrivateCodexTab('rainbow',this)">🌈 무지개</button>
    </div>

    <div id="privateCodexGrid" class="codexGrid"></div>

  </div>
</div>

<!-- =========================
     저장
========================= -->

<div id="saveModal" class="modal hidden">
  <div class="modalBox">

    <div class="modalHeader">
      <h2>💾 저장</h2>
      <button class="closeBtn" onclick="closeModal('saveModal')">닫기</button>
    </div>

    <input id="saveNameInput"
           class="saveInput"
           maxlength="30"
           placeholder="저장 이름">

    <button class="uiBtn"
            style="background:#148de0"
            onclick="saveNamedGame()">
      💾 이 이름으로 저장
    </button>

function catchFish(){

  const fish=
    chooseFish();

  const trait=
    getTrait();

  const key=
    fish.id+"|"+trait;

  inventory[key]=
    (inventory[key]||0)+1;

  discovered[key]=true;

  currentFish={

  };

  showCatchResult(fish,trait);

  autoSave();

  updatePrivateUI();

}


function chooseFish(){

  const luck=
    rods[currentRod].luck;

  const weights=[

    40,

    15,

    5*(1+luck/100),

    1.5*(1+luck/70),

    .3*(1+luck/55),

    .03*(1+luck/40)

  ];

  let total=
    weights.reduce((a,b)=>a+b,0);

  let r=
    Math.random()*total;

  for(let i=0;i<weights.length;i++){

    r-=weights[i];

    if(r<=0){

      const candidates=
        fishData.filter(f=>f.rarity===i);

      return candidates[
        Math.floor(
          Math.random()*candidates.length
        )
      ];
    }

  }

  return fishData[0];

}

    fishData[Number(fishId)];

    Math.floor(

    delete inventory[key];

  updatePrivateUI();

    slots[name];

  if(!data){

    alert("저장 데이터를 찾을 수 없습니다.");

    return;

  }

  applySaveData(data);

  alert(
    `"${name}" 저장 데이터를 불러왔습니다.`
  );

  closeModal("loadModal");

};


window.loadNamedGame=function(){

  const name=
    document.getElementById("loadNameInput")
      .value.trim();

  if(!name){

    alert("불러올 저장 이름을 입력해주세요.");

    return;

  }

  loadSlot(
    encodeURIComponent(name)
  );

};


window.deleteSlot=function(encoded){

  const name=
    decodeURIComponent(encoded);

  if(!confirm(
    `"${name}" 저장 데이터를 삭제할까요?`
  )){

    return;

  }

  const slots=
    getSaveSlots();

  delete slots[name];

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(slots)
  );

  renderSaveList();

  renderLoadList();

};


function applySaveData(data){

  money=
    Number(data.money)||0;

  currentRod=
    Math.max(
      0,
      Math.min(
        rods.length-1,
        Number(data.currentRod)||0
      )
    );

  inventory=
    data.inventory &&
    typeof data.inventory==="object"
      ? data.inventory
      : {};

  discovered=
    data.discovered &&
    typeof data.discovered==="object"
      ? data.discovered
      : {};

  updatePrivateUI();

  autoSave();

}


function autoSave(){

  try{

    localStorage.setItem(
      "fishing_auto_save",
      JSON.stringify(makeSaveData())
    );

  }catch(e){

    console.warn("자동 저장 실패",e);

  }

}


function loadAutoSave(){

  try{

    const raw=
      localStorage.getItem(
        "fishing_auto_save"
      );

    if(!raw)
      return;

    const data=
      JSON.parse(raw);

    applySaveData(data);

  }catch(e){

    console.warn(
      "자동 저장 데이터를 불러오지 못했습니다.",
      e
    );

  }

}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =====================================================
   공용 서버
===================================================== */

let currentUser=null;

let publicNickname="";

let publicPlayerX=50;

let publicPlayers={};

let publicUnsubs=[];

let publicCodex={};

let publicCodexTab="all";

let publicFish=[];

let publicKeysDown={};

let publicMoveTimer=null;

let publicJoined=false;


/* =====================================================
   Firebase 로그인
===================================================== */

async function ensureAnonymousLogin(){

  try{

    if(auth.currentUser){

      currentUser=
        auth.currentUser;

      return currentUser;

    }

    const credential=
      await signInAnonymously(auth);

    currentUser=
      credential.user;

    return currentUser;

  }catch(error){

    throw error;

  }

}


/* =====================================================
   닉네임 창
===================================================== */

window.openNickname=function(){

  document
    .getElementById("nicknameScreen")
    .classList.remove("hidden");

  setTimeout(()=>{

    document
      .getElementById("nicknameInput")
      .focus();

  },100);

};


window.closeNickname=function(){

  document

/* =====================================================
   공용 서버 입장
===================================================== */

window.joinPublicServer=async function(){

  const input=
    document.getElementById("nicknameInput");

  publicNickname=
    input.value.trim();

  if(!publicNickname){

    alert("닉네임을 입력해주세요.");

    return;

  }

  if(publicNickname.length>12){

    alert("닉네임은 12글자 이하로 입력해주세요.");

    return;

  }

  try{

    input.disabled=true;

    const user=
      await ensureAnonymousLogin();

    if(!user){

      throw new Error(
        "Firebase 익명 로그인을 완료하지 못했습니다."
      );

    }

    publicJoined=true;

    document
      .getElementById("nicknameScreen")
      .classList.add("hidden");

    document
      .getElementById("serverSelect")
      .classList.add("hidden");

    document
      .getElementById("publicGame")
      .classList.remove("hidden");

    document
      .getElementById("publicName")
      .textContent=
      publicNickname;

    await setupPublicPlayer();

    setupPublicListeners();

    createPublicFish();

    startPublicMovement();

  }catch(error){

    console.error(error);

    alert(
      "Firebase 연결에 실패했습니다.\n\n"+
      "오류 코드: "+
      (error.code||"없음")+
      "\n\n"+
      "오류 내용:\n"+
      (error.message||error)
    );

  }finally{

    input.disabled=false;

  }

};


/* =====================================================
   공용 플레이어
===================================================== */

async function setupPublicPlayer(){

  const uid=
    currentUser.uid;

  const playerRef=
    ref(
      db,
      "publicServer/players/"+uid
    );

  publicPlayerX=
    20+Math.random()*60;

  const color=
    getPlayerColor(uid);

  await set(playerRef,{

    name:publicNickname,

    x:publicPlayerX,

    color,

    joinedAt:Date.now()

  });

  onDisconnect(playerRef)
    .remove();

}


function getPlayerColor(uid){

  let n=0;

  for(let i=0;i<uid.length;i++){

    n=
      (n*31+uid.charCodeAt(i))>>>0;

  }

  const colors=[
    "#ff5757",
    "#4d8dff",
    "#50d878",
    "#c45cff",
    "#ff9d38",
    "#25d5d5",
    "#ff63b0",
    "#a7d93f"
  ];

  return colors[
    n%colors.length
  ];

}


/* =====================================================
   공용 리스너
===================================================== */

function setupPublicListeners(){

  publicUnsubs.forEach(fn=>{

    try{fn()}catch{}

  });

  publicUnsubs=[];


  const playersRef=
    ref(db,"publicServer/players");

  const unsubPlayers=
    onValue(
      playersRef,
      snapshot=>{

        publicPlayers=
          snapshot.val()||{};

        renderPublicPlayers();

      },
      error=>{

        console.error(
          "players listener",
          error
        );

        alert(
          "공용 플레이어 정보를 읽지 못했습니다.\n"+
          error.code+"\n"+
          error.message
        );

      }
    );

  publicUnsubs.push(unsubPlayers);


  const codexRef=
    ref(db,"publicServer/codex");

  const unsubCodex=
    onValue(
      codexRef,
      snapshot=>{

        publicCodex=
          snapshot.val()||{};

        updatePublicCodexCount();

      },
      error=>{

        console.error(
          "codex listener",
          error
        );

        alert(
          "공용 도감을 읽지 못했습니다.\n"+
          error.code+"\n"+
          error.message
        );

      }
    );

  publicUnsubs.push(unsubCodex);

}


/* =====================================================
   공용 플레이어 렌더링
===================================================== */

function renderPublicPlayers(){

  const world=
    document.getElementById("publicWorld");

  world
    .querySelectorAll(".publicPlayer")
    .forEach(el=>el.remove());


  Object.entries(publicPlayers)
    .forEach(([uid,p])=>{

      const player=
        document.createElement("div");

      player.className=
        "publicPlayer";

      player.style.left=
        p.x+"%";

      player.innerHTML=`

        <div class="playerName">
          ${escapeHtml(p.name||"플레이어")}
        </div>

        <div class="playerHead"></div>

        <div
          class="playerBody"
          style="background:${p.color||"#2980ff"}">
        </div>

      `;

      world.appendChild(player);

    });

}


/* =====================================================
   공용 이동
===================================================== */

function startPublicMovement(){

  if(publicMoveTimer)
    clearInterval(publicMoveTimer);

  publicMoveTimer=
    setInterval(()=>{

      if(!publicJoined || !currentUser)
        return;

      let direction=0;

      if(publicKeysDown["a"] ||
         publicKeysDown["ArrowLeft"]){

        direction=-1;

      }

      if(publicKeysDown["d"] ||
         publicKeysDown["ArrowRight"]){

        direction=1;

      }

      if(direction===0)
        return;

      publicPlayerX+=direction*.8;

      publicPlayerX=
        Math.max(
          3,
          Math.min(97,publicPlayerX)
        );

      const playerRef=
        ref(
          db,
          "publicServer/players/"+
          currentUser.uid
        );

      update(playerRef,{

        x:publicPlayerX

      });

    },60);

}


window.addEventListener("keydown",e=>{

  if(
    document
      .getElementById("publicGame")
      .classList.contains("hidden")
  )
    return;

  const key=
    e.key.toLowerCase();

  if(
    key==="a" ||
    key==="d" ||
    e.key==="ArrowLeft" ||
    e.key==="ArrowRight"
  ){

    publicKeysDown[key]=true;

    if(
      e.key==="ArrowLeft" ||
      e.key==="ArrowRight"
    ){

      publicKeysDown[e.key]=true;

    }

    e.preventDefault();

  }

});


window.addEventListener("keyup",e=>{

  const key=
    e.key.toLowerCase();

  delete publicKeysDown[key];

  delete publicKeysDown[e.key];

});


/* =====================================================
   공용 물고기
===================================================== */

function createPublicFish(){

  const world=
    document.getElementById("publicWorld");

  world
    .querySelectorAll(".publicCollectible")
    .forEach(el=>el.remove());

  publicFish=[];

  /*
    100종 전체를 공용 서버에 배치.
    화면을 좌우로 넓게 사용.
  */

  fishData.forEach((fish,i)=>{

    const x=
      2+(i%25)*4;

    const y=
      20+Math.floor(i/25)*16;

    const el=
      document.createElement("div");

    el.className=
      "publicCollectible";

    el.style.left=
      x+"%";

    el.style.bottom=
      (180+y)+"px";

    el.textContent=
      rarityEmojis[fish.rarity];

    el.title=
      "물고기 발견하기";

    el.dataset.fishId=
      fish.id;

    el.addEventListener(
      "click",
      ()=>discoverPublicFish(fish.id,el)
    );

    world.appendChild(el);

    publicFish.push(el);

  });

}


async function discoverPublicFish(fishId,element){

  if(!currentUser)
    return;

  const fish=
    fishData[fishId];

  /*
    공용 서버에서는 기본 특성으로
    해당 물고기 자체를 발견하도록 처리.
    이후 필요하면 특성별 발견도 확장 가능.
  */

  const key=
    fish.id+"|normal";

  try{

    const codexRef=
      ref(
        db,
        "publicServer/codex/"+key
      );

    await runTransaction(
      codexRef,
      current=>true
    );

    element.classList.add("caught");

    alert(
      "🐟 "+fish.name+
      " 발견!\n\n"+
      "공용 도감에 등록되었습니다."
    );

    updatePublicCodexCount();

  }catch(error){

    console.error(error);

    alert(
      "공용 도감 등록 실패\n"+
      error.code+"\n"+
      error.message
    );

  }

}


/* =====================================================
   공용 도감
===================================================== */

window.openPublicCodex=function(){

  renderPublicCodex();

  document
    .getElementById("publicCodexModal")
    .classList.remove("hidden");

};


window.closePublicCodex=function(){

  document
    .getElementById("publicCodexModal")
    .classList.add("hidden");

};


window.setPublicCodexTab=function(tab,button){

  publicCodexTab=tab;

  document
    .querySelectorAll(
      "#publicCodexModal .codexTabs button"
    )
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  renderPublicCodex();

};


function renderPublicCodex(){

  const grid=
    document.getElementById("publicCodexGrid");

  grid.innerHTML="";

  fishData.forEach(fish=>{

    traitKeys.forEach(trait=>{

      if(
        publicCodexTab!=="all" &&
        publicCodexTab!==trait
      )
        return;

      const key=
        fish.id+"|"+trait;

      const known=
        !!publicCodex[key];

      const t=
        traits[trait];

      const div=
        document.createElement("div");

      div.className=
        "codexCard "+
        (known?"known ":"")+
        "trait"+
        trait.charAt(0).toUpperCase()+
        trait.slice(1);

      div.innerHTML=`

        <div class="${known?"codexFish":"codexUnknown"}">
          ${known?t.emoji:"❓"}
        </div>

        <b>${known?fish.name:"???"}</b>

        <small>
          ${rarityEmojis[fish.rarity]}
          ${rarityNames[fish.rarity]}
        </small>

        <small>
          ${t.emoji} ${t.name}
        </small>

      `;

      grid.appendChild(div);

    });

  });

}


function updatePublicCodexCount(){

  const count=
    Object.keys(publicCodex)
      .filter(k=>publicCodex[k]).length;

  document
    .getElementById("publicCodexCount")
    .textContent=count;

}
